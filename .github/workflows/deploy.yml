name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

# Least privilege: read-only by default; only the image job may push to GHCR.
# TODO(security): pin third-party actions to full commit SHAs (needs network access to resolve them reliably).
permissions:
  contents: read

env:
  IMAGE: ghcr.io/anukulrajan7/email-agents
  APP_DIR: /docker/email-agents
  # No debug info in test builds: ~55 test binaries with full debug info exhaust the runner disk at link time.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/api
          shared-key: api
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust lint + tests
        run: |
          cargo clippy --manifest-path apps/api/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path apps/api/Cargo.toml
          cargo test --manifest-path apps/api/Cargo.toml --test api -- --ignored --exact deletion::a_two_thousand_email_purge_never_holds_the_write_lock_long
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Web typecheck + tests
        working-directory: apps/web
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test --run

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    # The VPS pulls the image with this job's GITHUB_TOKEN.
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: https://mail.anukulraj.tech
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Render server .env from secrets
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NANGO_API_KEY: ${{ secrets.NANGO_API_KEY }}
          NANGO_WEBHOOK_SECRET: ${{ secrets.NANGO_WEBHOOK_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          OPENROUTER_MODEL_ID: ${{ vars.OPENROUTER_MODEL_ID }}
          OPENROUTER_CLASSIFIER_MODEL_ID: ${{ vars.OPENROUTER_CLASSIFIER_MODEL_ID }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SIGNUP_ALLOWED_DOMAINS: ${{ vars.SIGNUP_ALLOWED_DOMAINS }}
          SIGNUP_ALLOWED_EMAILS: ${{ vars.SIGNUP_ALLOWED_EMAILS }}
          NANGO_GMAIL_MODEL: ${{ vars.NANGO_GMAIL_MODEL || 'GmailEmail' }}
        run: |
          umask 077
          cat > deploy.env <<ENV
          IMAGE=${IMAGE}
          IMAGE_TAG=${GITHUB_SHA}
          RUST_LOG=info,tower_http=info
          AUTH_MODE=password
          SIGNUP_ENABLED=true
          SIGNUP_ALLOWED_DOMAINS=${SIGNUP_ALLOWED_DOMAINS}
          SIGNUP_ALLOWED_EMAILS=${SIGNUP_ALLOWED_EMAILS}
          SMTP_HOST=smtp.hostinger.com
          SMTP_PORT=465
          SMTP_USERNAME=${SMTP_USERNAME}
          SMTP_PASSWORD=${SMTP_PASSWORD}
          SMTP_FROM=Post Room <${SMTP_USERNAME}>
          PUBLIC_WEB_URL=https://mail.anukulraj.tech
          API_PUBLIC_URL=https://mail.anukulraj.tech
          ALLOW_TEST_EMAILS=true
          INBOUND_DOMAIN=inbound.anukulraj.tech
          RESEND_API_KEY=${RESEND_API_KEY}
          RESEND_WEBHOOK_SECRET=${RESEND_WEBHOOK_SECRET}
          NANGO_API_KEY=${NANGO_API_KEY}
          NANGO_WEBHOOK_SECRET=${NANGO_WEBHOOK_SECRET}
          NANGO_GMAIL_INTEGRATION_ID=google-mail
          NANGO_GMAIL_MODEL=${NANGO_GMAIL_MODEL}
          TYPESAFE_API_KEY=${TYPESAFE_API_KEY}
          OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
          OPENROUTER_MODEL_ID=${OPENROUTER_MODEL_ID}
          OPENROUTER_CLASSIFIER_MODEL_ID=${OPENROUTER_CLASSIFIER_MODEL_ID}
          EMAIL_RETENTION_DAYS=30
          JOB_WORKER_CONCURRENCY=4
          AI_AUTO_HOURS=2
          AUTO_DRAFTS=false
          AI_DAILY_BUDGET_USD=2
          OPENROUTER_DRAFT_MODEL_ID=deepseek/deepseek-v4-flash
          OPENROUTER_PREMIUM_MODEL_ID=deepseek/deepseek-v4-pro
          OPENROUTER_PLANNER_MODEL_ID=deepseek/deepseek-v4-pro
          ENV
          sed -i 's/^ *//' deploy.env
      - name: Ship config and roll out
        run: |
          H="root@${{ secrets.VPS_HOST }}"
          ssh "$H" "mkdir -p $APP_DIR/data && chown 10001 $APP_DIR/data"
          scp compose.yml "$H:$APP_DIR/compose.yml"
          scp deploy.env "$H:$APP_DIR/.env"
          rm -f deploy.env
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh "$H" "docker login ghcr.io -u ${{ github.actor }} --password-stdin >/dev/null"
          ssh "$H" "cd $APP_DIR && docker compose pull && docker compose up -d --no-build --remove-orphans; docker logout ghcr.io >/dev/null"
      - name: Health check
        run: |
          for i in $(seq 1 30); do
            if ssh "root@${{ secrets.VPS_HOST }}" "curl -fsS http://127.0.0.1:18090/health/ready"; then exit 0; fi
            sleep 2
          done
          ssh "root@${{ secrets.VPS_HOST }}" "cd $APP_DIR && docker compose logs --tail 80"
          exit 1
