name: e2e

# Browser E2E (Playwright, Chromium only, headless) against the real API: fresh SQLite file, AI_MOCK=1, captured mail
# and a stand-in for Nango/Gmail. No secrets, no network calls to AI providers. See apps/web/e2e.
# On main it runs inside deploy.yml (workflow_call) as a required gate, so the push trigger skips main.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  # In a called workflow github.workflow is the caller's name, so the deploy copy gets its own group.
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # No debug info in test builds: ~55 test binaries with full debug info exhaust the runner disk at link time.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/api
          shared-key: api
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install web dependencies and Chromium
        working-directory: apps/web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Build the API
        run: cargo build --manifest-path apps/api/Cargo.toml --bin email-ai-api
      - name: Run the browser E2E suite
        working-directory: apps/web
        run: pnpm e2e
      - name: Upload the report, traces, screenshots and videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/e2e/.report
            apps/web/e2e/.results
          retention-days: 7
