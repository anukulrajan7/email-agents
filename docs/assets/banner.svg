<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="Post Room: the sorting office for your email">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d1a16"/>
      <stop offset="1" stop-color="#2b2420"/>
    </linearGradient>
    <linearGradient id="stamp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8a33d"/>
      <stop offset="1" stop-color="#c9772b"/>
    </linearGradient>
    <pattern id="grain" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.6" fill="#ffffff" opacity="0.035"/>
      <circle cx="4" cy="4" r="0.5" fill="#ffffff" opacity="0.025"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="24" fill="url(#grain)"/>

  <!-- postmark rings -->
  <g stroke="#e8a33d" stroke-opacity="0.13" fill="none" stroke-width="2">
    <circle cx="1090" cy="120" r="70"/>
    <circle cx="1090" cy="120" r="54"/>
    <path d="M960 100 q30 -14 60 0 t60 0 t60 0 t60 0" />
    <path d="M960 122 q30 -14 60 0 t60 0 t60 0 t60 0" />
    <path d="M960 144 q30 -14 60 0 t60 0 t60 0 t60 0" />
  </g>

  <!-- title -->
  <g font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', serif">
    <text x="88" y="150" fill="#e8a33d" font-size="22" letter-spacing="6">POST ROOM</text>
    <text x="86" y="222" fill="#f6efe4" font-size="62" font-weight="700">The sorting office</text>
    <text x="86" y="290" fill="#f6efe4" font-size="62" font-weight="700">for your email.</text>
  </g>
  <g fill="#bfb3a3" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20">
    <text x="88" y="336">A personal AI agent and a team of experts</text>
    <text x="88" y="364">that read, route, draft and record, safely.</text>
  </g>

  <!-- sorting cabinet: envelopes into pigeonholes -->
  <g transform="translate(760 190)" filter="url(#soft)">
    <rect x="0" y="0" width="420" height="190" rx="14" fill="#3a302a" stroke="#4a3e36"/>
    <g fill="#2a231f" stroke="#54463c">
      <rect x="18" y="18" width="88" height="70" rx="6"/>
      <rect x="118" y="18" width="88" height="70" rx="6"/>
      <rect x="218" y="18" width="88" height="70" rx="6"/>
      <rect x="318" y="18" width="88" height="70" rx="6"/>
      <rect x="18" y="102" width="88" height="70" rx="6"/>
      <rect x="118" y="102" width="88" height="70" rx="6"/>
      <rect x="218" y="102" width="88" height="70" rx="6"/>
      <rect x="318" y="102" width="88" height="70" rx="6"/>
    </g>
    <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#bfb3a3" text-anchor="middle">
      <text x="62" y="80">Leave</text>
      <text x="162" y="80">Timesheets</text>
      <text x="262" y="80">Hiring</text>
      <text x="362" y="80">Payroll</text>
      <text x="62" y="164">Support</text>
      <text x="162" y="164">Sales</text>
      <text x="262" y="164">Invoices</text>
      <text x="362" y="164">Meetings</text>
    </g>
    <!-- letters sitting in slots -->
    <g>
      <rect x="34" y="34" width="56" height="30" rx="3" fill="#f6efe4"/>
      <path d="M34 34 l28 18 l28 -18" fill="none" stroke="#c9b9a3" stroke-width="2"/>
      <rect x="134" y="30" width="56" height="34" rx="3" fill="#f6efe4"/>
      <path d="M134 30 l28 20 l28 -20" fill="none" stroke="#c9b9a3" stroke-width="2"/>
      <rect x="182" y="32" width="10" height="12" fill="url(#stamp)"/>
      <rect x="334" y="118" width="56" height="30" rx="3" fill="#f6efe4"/>
      <path d="M334 118 l28 18 l28 -18" fill="none" stroke="#c9b9a3" stroke-width="2"/>
      <rect x="234" y="120" width="56" height="28" rx="3" fill="#f6efe4"/>
      <path d="M234 120 l28 16 l28 -16" fill="none" stroke="#c9b9a3" stroke-width="2"/>
    </g>
  </g>

  <!-- an envelope in flight -->
  <g transform="translate(830 60) rotate(-12)" filter="url(#soft)">
    <rect x="0" y="0" width="120" height="76" rx="6" fill="#f6efe4"/>
    <path d="M0 0 l60 42 l60 -42" fill="none" stroke="#c9b9a3" stroke-width="3"/>
    <rect x="94" y="8" width="18" height="22" rx="2" fill="url(#stamp)"/>
  </g>
  <path d="M960 132 C 960 170, 930 185, 925 205" stroke="#e8a33d" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="4 7" fill="none"/>
</svg>
